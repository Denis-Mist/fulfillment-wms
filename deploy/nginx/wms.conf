# Сайт WMS для системного nginx. Ставится в /etc/nginx/sites-available/wms и включается симлинком.
# Плейсхолдеры: __SERVER_NAME__ (IP или домен), __API_PORT__ (порт wms-api на 127.0.0.1).
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /opt/wms/web;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service Worker демо-режима (MSW): не кэшировать, иначе обновление SW застрянет у клиентов
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback (vue-router в history-режиме)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
